<svg viewBox="0 0 240 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ff1a40" />
      <stop offset="50%" stopColor="#ff0033" />
      <stop offset="100%" stopColor="#d60029" />
    </linearGradient>
    <linearGradient id="markGradLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="1" />
      <stop offset="100%" stopColor="#f1f5f9" stopOpacity="0.9" />
    </linearGradient>
    <linearGradient id="markGradRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stopColor="#ffffff" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#ffffff" stopOpacity="1" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="36" height="36" rx="9" fill="url(#bgGrad)" stroke="#ff4d6a" stroke-width="0.8" />
    <path d="M4 1.5 C7 1.2, 29 1.2, 32 1.5" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.4" stroke-linecap="round" />

    <!-- Left Segment -->
    <path
      d="M10 11C10 9.8 11.1 9.0 12.3 9.3L17.2 10.6C18.2 10.8 18.9 11.7 18.9 12.7V23.3C18.9 24.3 18.2 25.2 17.2 25.4L12.3 26.7C11.1 27.0 10 26.2 10 25.0V11Z"
      fill="url(#markGradLeft)"
    />

    <!-- Right Segment -->
    <path
      d="M21.5 12.3C21.5 11.2 22.7 10.5 23.6 11.2L29.8 15.8C30.6 16.4 30.6 17.6 29.8 18.2L23.6 22.8C22.7 23.5 21.5 22.8 21.5 21.7V12.3Z"
      fill="url(#markGradRight)"
    />

    <!-- Center Pulse -->
    <circle cx="14.5" cy="18" r="1.3" fill="#ff0033" fill-opacity="0.85" />
  </g>

  <!-- Typography: YouTube Analytics -->
  <text x="50" y="24" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" letter-spacing="-0.02em">
    YouTube Analytics
  </text>

  <!-- Monospace PRO Badge -->
  <rect x="190" y="12" width="36" height="18" rx="4" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" />
  <text x="197" y="25" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="0.05em">
    PRO
  </text>
</svg>
