    </linearGradient>
    <filter id="shadow" x="0" y="0" width="32" height="34" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ff0033" flood-opacity="0.3" />
    </filter>
